<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hash Room Payment</title>

<style>

body{
background:#0d0d0d;
font-family:Arial,sans-serif;
color:white;
text-align:center;
padding:30px;
}

.card{
background:#1a1a1a;
border-radius:20px;
padding:25px;
max-width:420px;
margin:auto;
border:1px solid #333;
box-shadow:0 0 20px rgba(255,181,0,.25);
}

h1{
color:#ffb300;
}

.wallet{
background:#111;
padding:15px;
border-radius:12px;
margin:20px 0;
word-break:break-all;
color:#00ff99;
font-size:14px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.copy{
background:#ffb300;
color:#000;
}

.paid{
background:#00c853;
color:#fff;
}

</style>

</head>

<body>

<div class="card">

<h1>Hash Room</h1>

<h3>USDT (BEP20)</h3>

<p>Please send your payment to:</p>

<div class="wallet" id="wallet">
0x9D378cC1F4Ee18690eE591c203Ee63ff66903974
</div>

<button class="copy" onclick="copyWallet()">
Copy Wallet
</button>

<button class="paid" onclick="paid()">
I've Paid
</button>

</div>

<script>

function copyWallet(){

navigator.clipboard.writeText(document.getElementById("wallet").innerText);

alert("Wallet copied");

}

function paid(){

alert("Your payment request has been received.");

}

</script>

</body>
</html>
