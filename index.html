<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HashRoom</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<div class="header">

  <div class="brand">
    <img src="assets/images/logo.png" class="logo">
    <div>
      <h2>HASH ROOM</h2>
      <p>Welcome back <span id="username">User</span></p>
    </div>
  </div>

  <div class="user-box">
    <strong id="plan">Miner VIP 2</strong><br>
    <small>ID: <span id="userid">0</span></small>
  </div>

</div>



<div class="card">

  <div class="top-card">

    <h2>Total Balance</h2>

    <h1 id="balance">0.01258634 BTC</h1>

    <p>≈ $658.25</p>

  </div>

  <div class="actions">

    <button class="deposit">
      Deposit
    </button>

    <button class="withdraw">
      Withdraw
    </button>

  </div>

</div>










<div class="stats">

<div class="stat">

<h3>250 TH/s</h3>

<p>Hash Rate</p>

</div>

<div class="stat">

<h3>0.00081 BTC</h3>

<p>Daily Output</p>

</div>

<div class="stat">

<h3>0.005689 BTC</h3>

<p>Total Earned</p>

</div>

</div>

<div class="miner-card">

<img src="assets/images/miner.png" width="220">

<p style="color:#38ff6b;">● Active</p>

<button id="startBtn">

⚡ Start Mining

</button>

</div>
<nav class="bottom-nav">
  <a href="#" class="nav-item active">
    <span>🏠</span>
    <small>Home</small>
  </a>

  <a href="plans.html" class="nav-item">
    <span>📦</span>
    <small>Plans</small>
  </a>

  <a href="mining.html" class="nav-item">
    <span>⛏️</span>
    <small>Mining</small>
  </a>

  <a href="wallet.html" class="nav-item">
    <span>👛</span>
    <small>Wallet</small>
  </a>

  <a href="referral.html" class="nav-item">
    <span>👥</span>
    <small>Referral</small>
  </a>
    </nav>








<script src="script.js"></script>
  

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

if(user){
    document.getElementById("username").innerText = user.first_name;
    document.getElementById("userid").innerText = user.id;
}
</script>

</body>
</html>
