<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HashRoom</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

<div class="container">

<div class="header">

<div class="brand">
<img src="assets/images/logo.png" class="logo">

<div>
<h2>HASH ROOM</h2>
<p>Welcome <span id="username">User</span></p>
</div>

</div>

<div class="user-box">
<strong id="plan">No Plan</strong><br>
<small>ID: <span id="userid">0</span></small>
</div>

</div>

<div class="card">

<div class="top-card">
<h2>Total Balance</h2>

<h1 id="balance">0 BTC</h1>

<p id="usd">≈ $0.00</p>
</div>

<div class="actions">
<button class="deposit">Deposit</button>
<button class="withdraw">Withdraw</button>
</div>

</div>

<div class="stats">

<div class="stat">
<h3 id="hashrate">0 TH/s</h3>
<p>Hash Rate</p>
</div>

<div class="stat">
<h3 id="daily">0 BTC</h3>
<p>Daily Output</p>
</div>

<div class="stat">
<h3 id="earned">0 BTC</h3>
<p>Total Earned</p>
</div>

</div>

<div class="miner-card">

<img src="assets/images/miner.png" width="220">

<p id="mineStatus">Inactive</p>

<button id="startBtn">
Start Mining
</button>

</div>

<nav class="bottom-nav">

<a href="index.html">🏠<br>Home</a>

<a href="plans.html">📦<br>Plans</a>

<a href="mining.html">⛏<br>Mining</a>

<a href="wallet.html">👛<br>Wallet</a>

<a href="referral.html">👥<br>Referral</a>

</nav>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.expand();

const user = tg.initDataUnsafe.user;

if(user){

document.getElementById("username").innerText=user.first_name;

document.getElementById("userid").innerText=user.id;

localStorage.setItem("uid",user.id);

localStorage.setItem("username",user.first_name);

}

</script>

<script type="module" src="script.js"></script>

</body>
</html>
